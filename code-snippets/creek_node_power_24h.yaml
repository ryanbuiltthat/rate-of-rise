# Creek node — power consumption over the last 24 hours
# =====================================================================================
# Produces sensor.creek_node_energy_24h: watt-hours drawn by the pole node over a
# rolling 24-hour window, updated continuously (not a midnight-reset daily total).
#
# WHAT THIS MEASURES, AND WHAT IT DOES NOT
# The node has no shunt and no current sensor. Its payload carries distance_mm and
# battery_mv, nothing else (firmware/moteino_creek_node/src/main.cpp), so 24-hour
# consumption cannot be measured here — it has to be modelled:
#
#     power (W) = measured pack voltage  x  modelled current
#
# The voltage half is real, live, and from the node. The current half is modelled from
# two measured figures (docs/node-hardware.md "Power budget", open question #17): the
# input_number below, ~1.7 mA in normal 60 s reporting, and ~36 mA while the gateway
# reports fast sampling, when the radar rail stays up. So what comes out is a *budget
# tracker*, not a measurement. It is still worth having: it follows the node into and out
# of fast sampling, which is where a storm day's energy goes, and it falls to zero when
# the node goes quiet. A quiet day is ~0.19 Wh (~48 mAh). A day well under that means
# downtime, and a day well over it means fast sampling.
#
# In daylight the battery sensor reads the charger's OUT rail, not the cell (up to 4.8 V;
# see node-hardware.md). That is the rail the node runs from, so the power figure holds.
#
# To make it a true measurement you need current sensing on the pack rail (an INA219 or
# INA226 on the node's I2C, its mA added to the RFM69 payload) — at which point delete
# the input_number and the template sensor below and point the integration straight at
# the real current sensor. The rest of the chain is unchanged.
#
# OFFLINE = ZERO. When binary_sensor.creek_gateway_creek_node_status is off, or
# binary_sensor.creek_telemetry_stale (ha-packages/creek_node_health.yaml) is on, this
# publishes 0 W. Both are needed: the status sensor only writes on a transition, so it can
# sit at on after packets stop, and the packet-based stale flag is what catches that. The
# node may in fact be alive and merely out of radio range, so this undercounts in that
# case. It is the honest default anyway: the point of the number is to show power spent
# on telemetry that actually arrived.
#
# HOW TO INSTALL — pick one
#
#   A. YAML (recommended here, since this repo already uses packages). Save this file as
#      ha-packages/creek_node_power.yaml next to creek_warning.yaml, with
#          homeassistant:
#            packages: !include_dir_named ha-packages
#      already in configuration.yaml. Restart HA.
#
#   B. Straight into configuration.yaml. Paste the blocks below, but MERGE them into any
#      template:/sensor:/input_number: keys you already have — YAML allows each top-level
#      key only once per file. Restart HA.
#
#   C. Through the UI, no file editing. Settings > Devices & Services > Helpers >
#      Create helper, five times, in this order:
#        1. Number ............ name "Creek Node Average Current", min 1, max 250,
#                               step 0.5, unit mA, display mode Box. Set it to 2.
#        2. Template > sensor . name "Creek Node Current", paste its state template from
#                               the template: block below, unit mA, device class
#                               Current, state class Measurement.
#        3. Template > sensor . name "Creek Node Power", same again with its template,
#                               unit W, device class Power, state class Measurement.
#        4. Integral - Riemann sum integral sensor
#                               input sensor.creek_node_power, method Left Riemann sum,
#                               precision 3, max sub-interval 1 minute (REQUIRED — see
#                               the note on the integration block), name
#                               "Creek Node Energy".
#        5. Statistics ........ input sensor.creek_node_energy, characteristic "change",
#                               max age 24:00:00, sampling size 4000, name
#                               "Creek Node Energy 24h".
#      The UI creates the same five entities under the same entity IDs.
#
# Written against Home Assistant 2026.9.3 and the entity IDs the creek gateway currently
# publishes (sensor.creek_gateway_creek_node_battery,
# binary_sensor.creek_gateway_creek_node_status,
# binary_sensor.outside_creek_gateway_creek_node_fast_sampling), plus
# binary_sensor.creek_telemetry_stale from ha-packages/creek_node_health.yaml. If that
# package is not installed, the stale check reads as "not stale" and the status sensor
# alone decides.
# =====================================================================================

# --- The one tunable -----------------------------------------------------------------
# Average pack-side current, everything included: Moteino M0, RFM69HW, and the SEN0676
# on its switched 5 V boost, averaged across sleep, wake, Modbus read, TX and the
# post-TX OTA listen window. Measured at ~1.7 mA on 2026-09-25 (open question #17: overnight
# pack slope, anchored by a meter reading of the radar rail), so set it to 2, the nearest
# step. It read ~36 mA until 2026-09-23, while a miswired SHDN kept the radar on 24/7. The
# retired ESP32-C6 node's budget was ~80 mA, which is what the panel and pack were sized
# against.
#
# It is an input_number rather than a constant on purpose, so it can follow a future
# re-measurement (an overnight slope converts at ~3.4 mA per mV/h; see node-hardware.md).
#
# Fast sampling is not tunable here. Adaptive crest sampling (5 s cadence during a rise,
# FAST_REPORT_INTERVAL_S in main.cpp) holds the radar rail up, and the rail was measured
# at 35.09 mA with the radar on. Add ~1 mA for a 5 s wake cycle and that is 36 mA, a
# measurement rather than a guess, so it is a constant in the Creek Node Current template.
input_number:
  creek_node_avg_current_ma:
    name: Creek Node Average Current
    icon: mdi:current-dc
    min: 1
    max: 250
    step: 0.5
    unit_of_measurement: mA
    mode: box

# --- Instantaneous modelled draw -----------------------------------------------------
# Both templates never return unavailable or unknown. A Riemann sum stops accumulating
# across a non-numeric source state, so a template that went unavailable whenever the
# gateway restarted would quietly punch holes in the 24-hour total. Falling back to 0
# (node down) or to a nominal 3.9 V (node up, voltage not yet in) keeps the integral
# continuous and keeps the error where it can be reasoned about.
template:
  - sensor:
      # The whole model lives here: offline, fast sampling, or normal reporting.
      - name: "Creek Node Current"
        unique_id: creek_node_current
        unit_of_measurement: mA
        device_class: current
        state_class: measurement
        icon: mdi:current-dc
        state: >
          {% set online = is_state('binary_sensor.creek_gateway_creek_node_status', 'on')
             and not is_state('binary_sensor.creek_telemetry_stale', 'on') %}
          {% if not online %}
            0
          {% elif is_state('binary_sensor.outside_creek_gateway_creek_node_fast_sampling', 'on') %}
            36
          {% else %}
            {{ states('input_number.creek_node_avg_current_ma') | float(2) }}
          {% endif %}
        attributes:
          modelled: true
          fast_sampling: >
            {{ is_state('binary_sensor.outside_creek_gateway_creek_node_fast_sampling', 'on') }}

      - name: "Creek Node Power"
        unique_id: creek_node_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:flash
        state: >
          {{ (states('sensor.creek_gateway_creek_node_battery') | float(3.9)
              * states('sensor.creek_node_current') | float(0) / 1000) | round(4) }}
        attributes:
          modelled: true
          current_ma: "{{ states('sensor.creek_node_current') | float(0) }}"

sensor:
  # --- Cumulative energy -------------------------------------------------------------
  # Riemann sum of the power sensor: W integrated over hours, so the unit comes out Wh.
  #
  # max_sub_interval is load-bearing, not tuning. The integration only adds area when its
  # source *changes state*, and this source is near-constant — a node sitting at a steady
  # voltage and a fixed assumed current can hold the same rounded watt figure for hours,
  # during which the integral would not move at all and the 24-hour window below would
  # read far too low. max_sub_interval forces a step every minute regardless.
  #
  # method: left because the source is a step function that holds its value until the
  # next report, which is exactly what a left sum assumes. Trapezoidal would interpolate
  # a ramp between reports that the node never actually traversed.
  - platform: integration
    name: "Creek Node Energy"
    unique_id: creek_node_energy
    source: sensor.creek_node_power
    method: left
    round: 3
    max_sub_interval:
      minutes: 1

  # --- The answer: rolling 24-hour consumption ---------------------------------------
  # state_characteristic: change over a 24-hour window is (newest - oldest), and because
  # the integration above only ever climbs, that difference is precisely the energy drawn
  # since this time yesterday. It moves continuously rather than resetting at midnight.
  #
  # sampling_size must exceed the number of samples in the window or the oldest fall out
  # early and the window silently shortens. At one forced step per minute that is 1440,
  # plus whatever the node's own 60 s reports add on top; 4000 covers both with room for
  # a storm running at the 5 s fast cadence.
  - platform: statistics
    name: "Creek Node Energy 24h"
    unique_id: creek_node_energy_24h
    entity_id: sensor.creek_node_energy
    state_characteristic: change
    max_age:
      hours: 24
    sampling_size: 4000
    precision: 2

# =====================================================================================
# OPTIONAL — the same thing in battery terms
# =====================================================================================
# Watt-hours are the conventional answer to "power consumption", but every sizing figure
# in docs/node-hardware.md is in amp-hours: the as-built pack is 1S4P of 1500 mAh cells,
# 6000 mAh total, and the node should be spending ~40–50 mAh/day of it on a quiet day.
# The capacity is input_number.creek_node_pack_capacity_mah (defined in
# ha-packages/creek_node_health.yaml, set from the UI when the pack changes); 0 or
# missing reads as the as-built 6000.
# These three give that directly, from sensor.creek_node_current above. Merge them into
# the blocks above (they are shown under their own keys only so the section can be
# dropped in or left out as a unit).
#
# sensor.creek_node_pack_used_24h is the one to put on a dashboard: percent of the whole
# pack the node drew in the last day. Under 1 % is a quiet day; each hour of fast sampling
# adds ~0.6 %. Voltage does not enter it, so it moves only with fast-sampling time, node
# uptime and the assumed current. It is what the node drew, not what the pack lost: in
# daylight the panel carries the load.
#
# template:
#   - sensor:
#       # Percent of the installed pack drawn in the last 24 h.
#       - name: "Creek Node Pack Used 24h"
#         unique_id: creek_node_pack_used_24h
#         unit_of_measurement: "%"
#         state_class: measurement
#         icon: mdi:battery-clock
#         state: >
#           {% set c = states('input_number.creek_node_pack_capacity_mah') | float(0) %}
#           {{ (states('sensor.creek_node_charge_24h') | float(0)
#               / (c if c > 0 else 6000) * 100) | round(1) }}
#
# sensor:
#   - platform: integration
#     name: "Creek Node Charge"
#     unique_id: creek_node_charge
#     source: sensor.creek_node_current
#     method: left
#     round: 1
#     max_sub_interval:
#       minutes: 1
#
#   - platform: statistics
#     name: "Creek Node Charge 24h"
#     unique_id: creek_node_charge_24h
#     entity_id: sensor.creek_node_charge
#     state_characteristic: change
#     max_age:
#       hours: 24
#     sampling_size: 4000
#     precision: 1

# =====================================================================================
# OPTIONAL — calendar-day totals instead of a rolling window
# =====================================================================================
# If "last 24 hours" was meant loosely and midnight-to-midnight is fine, a utility meter
# over the same integration sensor is cheaper than the statistics sensor and carries
# yesterday's total in its last_period attribute. It resets at midnight, so it is not a
# rolling window and reads near zero at 00:05 — keep the statistics sensor above if that
# matters. The two can coexist on one integration source.
#
utility_meter:
  creek_node_energy_daily:
    name: Creek Node Energy Daily
    source: sensor.creek_node_energy
    cycle: daily

# =====================================================================================
# Dashboard — NOT package YAML. Paste into a Lovelace dashboard, not this file.
# =====================================================================================
# A package file may only contain top-level integration domains (template:, sensor:,
# input_number:, utility_meter:, ...). A card's type:/title:/entities: keys are not
# domains, so leaving them uncommented here fails the whole package with
# "expected dict or list or None at 'type'". Copy the block below into the dashboard
# raw editor (three-dot menu > Edit dashboard > Raw configuration editor) or use
# "Add card > Manual".
#
# type: entities
# title: Creek Node Power
# entities:
#   - entity: sensor.creek_node_energy_24h
#     name: Energy, last 24 h
#   - entity: sensor.creek_gateway_creek_node_battery
#     name: Pack voltage
#   - entity: sensor.creek_node_power
#     name: Modelled draw
#   - entity: sensor.creek_node_current
#     name: Modelled current
#   - entity: binary_sensor.outside_creek_gateway_creek_node_fast_sampling
#     name: Fast sampling
#   - entity: input_number.creek_node_avg_current_ma
#     name: Assumed quiet-day current
#   - entity: binary_sensor.creek_gateway_creek_node_status
#     name: Node link
+
