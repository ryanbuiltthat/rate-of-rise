# Creek node & gateway health flags — and the push that tells a person about any of them
# =====================================================================================
# Ways the creek data can stop being true, and how each is noticed.
#
#   radar fault     -> packets arrive carrying no reading. The link is fine; the sensor on
#                      the end of it is not. Detected ON THE GATEWAY (it has the packets) and
#                      published as binary_sensor.*_creek_node_radar_fault.
#   stage frozen    -> packets arrive carrying a reading, but the same one for 30 min. The
#                      2026-09-23 morning: one value for 3 h 11 min, and no null to count.
#                      Detected in the add-on (binary_sensor.outside_rate_of_rise_creek_stage_frozen).
#   stage implausible -> a reading the creek could not have reached (a cold radar's 0,
#                      clamped to 37.6 in by the gateway). Withheld from the tiers by the
#                      add-on (binary_sensor.outside_rate_of_rise_creek_stage_implausible).
#   link down / gateway down -> no packets at all. THIS FILE, below.
#
# WHY THE STALENESS CHECK IS HERE AND NOT IN THE FIRMWARE.
# A device cannot report its own death. A gateway that stops publishing while holding its
# API connection open leaves every entity frozen at its last value — including
# binary_sensor.creek_gateway_creek_node_status, which only writes on a transition. The only
# place that outage is visible is outside the gateway, by noticing that a value which should
# keep changing has stopped.
#
# (The 25-hour silence of 2026-09-23 that prompted this was, at least in part, Home
# Assistant's RECORDER stopping — every entity in the database went silent, add-on included,
# while automations kept running. A recorder stall looks exactly like a frozen device on a
# history graph. This check reads live state, not the recorder, so it is right either way.)
#
# WHY THE PACKET COUNTER IS THE BEACON.
# It is monotonic, so it changes on every single packet and last_updated moves with it.
# Battery voltage can legitimately hold the same value for many minutes (6.45 mV ADC
# quantum), and node_status only writes on transition -- both can look frozen while healthy.
#
# ENTITY IDS ARE NOT WHAT THE REPO IMPLIES. The gateway device was renamed in HA at some
# point, and HA does not retroactively rename existing entity_ids -- so entities created
# before the rename kept `creek_gateway_` and everything created after got
# `outside_creek_gateway_`. Both prefixes are live and correct. Verify against the entity
# list before changing either; do not "tidy" them to match.
#
# BATTERY PACK HEALTH (sensor.creek_node_pack_health): healthy / unhealthy / replace now.
# The node reports one number about power, its battery voltage, and in daylight even that
# is the charger's OUT rail (up to 4.8 V), not the cell. So the verdict is taken once a
# day at 04:30, from the dark hours only (docs/node-hardware.md, open question #17):
#   - pre-dawn voltage   how full the pack is at its lowest point of the day
#   - overnight slope    HA's `trend` sensor fits it by least squares. At 3.4 mA per mV/h
#                        (measured on the 6 Ah pack, scaled to the capacity number) it
#                        becomes an implied drain in mA, compared with the ~2 mA the node
#                        should draw. Skipped on a night with fast sampling (the radar rail
#                        stays up, ~36 mA) or too few samples (trend forgets on restart).
#   - charge input       the day's highest reading above 4.25 V can only be the charger's
#                        OUT rail, so the panel was feeding it. None in 24 h means the
#                        KSD9700 cold cutoff (open below 5 degC) or no sun, which is not a
#                        pack fault; then only the reserve left decides.
# A fast drain on a quiet night cannot tell a weak pack from a load that is not switching
# off (the SHDN wire, #17), so it says "unhealthy" with that reason, never "replace now".
# "Replace now" is kept for a pack that is flat (< 3.50 V) or overcharged (> 4.25 V at
# night), and it pushes to the phones through the data-problem automation below.
#
# The pack's capacity is input_number.creek_node_pack_capacity_mah, set from the UI.
# Change it when a different pack goes on the pole. 0 means "not set" and reads as the
# as-built 6000 mAh, which is why the minimum is 0 and there is no `initial:` (that would
# reset the UI value on every restart).
#
# INSTALL: save to /config/ha-packages/ (alongside creek_warning.yaml), then Developer tools
# -> YAML -> "All YAML configuration" reload (or restart HA). The pause timer and the phone
# ids live in creek_warning.yaml; this file needs it loaded too.
# =====================================================================================

input_number:
  creek_node_pack_capacity_mah:
    name: Creek Node Pack Capacity
    icon: mdi:battery-high
    min: 0
    max: 50000
    step: 100
    unit_of_measurement: mAh
    mode: box

template:
  - binary_sensor:
      # ON when the creek telemetry has stopped arriving, for any reason.
      #
      # `now()` is load-bearing: HA re-renders any template containing it at the top of every
      # minute, which is what makes a time-since-last-update test work at all. Without it this
      # would only re-evaluate when the source entity changed -- and the whole point is to fire
      # when the source entity has STOPPED changing.
      - name: "Creek Telemetry Stale"
        unique_id: creek_telemetry_stale
        device_class: problem
        icon: mdi:link-variant-off
        state: >
          {% set e = 'sensor.outside_creek_gateway_creek_node_packets' %}
          {% if states(e) in ['unknown', 'unavailable', 'none'] %}
            true
          {% else %}
            {{ (now() - states[e].last_updated).total_seconds() > 300 }}
          {% endif %}
        attributes:
          # Surfaced so a notification can say how long, and so the dashboard shows the
          # number climbing rather than only a binary that flips at 5 minutes.
          seconds_since_packet: >
            {% set e = 'sensor.outside_creek_gateway_creek_node_packets' %}
            {% if states(e) in ['unknown', 'unavailable', 'none'] %}
              -1
            {% else %}
              {{ (now() - states[e].last_updated).total_seconds() | round(0) }}
            {% endif %}

      # Rolls the gauge faults into one thing to put on a dashboard. Deliberately does NOT
      # include the diagnostic-active flag: a held radar rail is the system doing what it
      # was told, not a fault.
      - name: "Creek Gauge Unhealthy"
        unique_id: creek_gauge_unhealthy
        device_class: problem
        icon: mdi:alert-circle-outline
        state: >
          {{ is_state('binary_sensor.creek_telemetry_stale', 'on')
             or is_state('binary_sensor.outside_creek_gateway_creek_node_radar_fault', 'on')
             or is_state('binary_sensor.creek_gateway_creek_node_status', 'off')
             or is_state('binary_sensor.outside_rate_of_rise_creek_stage_frozen', 'on')
             or is_state('binary_sensor.outside_rate_of_rise_creek_stage_implausible', 'on') }}

      # Its own entity so the push below can trigger on it like every other watchdog.
      - name: "Creek Node Pack Replace Now"
        unique_id: creek_node_pack_replace_now
        device_class: problem
        icon: mdi:battery-alert-variant-outline
        state: "{{ is_state('sensor.creek_node_pack_health', 'replace now') }}"

  # The pack verdict, once a day. Only 04:30: at any daytime hour the "battery" reading is
  # the charger's OUT rail, and every input below would be judging the charger instead.
  # Trigger-based, so the state and its attributes survive an HA restart.
  - triggers:
      - trigger: time
        at: "04:30:00"
    variables:
      capacity_mah: >-
        {%- set c = states('input_number.creek_node_pack_capacity_mah') | float(0) -%}
        {{ c if c > 0 else 6000 }}
      quiet_ma: "{{ states('input_number.creek_node_avg_current_ma') | float(2) }}"
      predawn_v: "{{ states('sensor.creek_node_battery_predawn') | float(none) }}"
      charged: "{{ states('sensor.creek_node_battery_max_24h') | float(0) > 4.25 }}"
      fast_h: "{{ states('sensor.creek_node_fast_sampling_tonight') | float(0) }}"
      samples: "{{ state_attr('binary_sensor.creek_node_pack_trend', 'sample_count') | int(0) }}"
      gradient: "{{ state_attr('binary_sensor.creek_node_pack_trend', 'gradient') }}"
      slope_ok: "{{ gradient is number and samples >= 30 and fast_h == 0 }}"
      # Trend's gradient is V per second; a falling pack is a positive drain.
      drain_mv_h: "{{ (-gradient * 3600000) | round(2) if slope_ok else none }}"
      implied_ma: "{{ (drain_mv_h * 3.4 * capacity_mah / 6000) | round(1) if slope_ok else none }}"
      # Resting 1S Li-ion, approximate: good enough for days-in-reserve, not for alarms.
      soc_pct: >-
        {%- set v = predawn_v -%}
        {%- set pts = [[3.0, 0], [3.3, 1], [3.4, 4], [3.5, 10], [3.6, 22], [3.7, 40],
                       [3.8, 56], [3.9, 68], [4.0, 79], [4.1, 90], [4.2, 100]] -%}
        {%- if v is not number -%} None
        {%- elif v <= 3.0 -%} 0
        {%- elif v >= 4.2 -%} 100
        {%- else -%}
          {%- set ns = namespace(soc=0) -%}
          {%- for i in range(pts | length - 1) -%}
            {%- set lo = pts[i] -%}
            {%- set hi = pts[i + 1] -%}
            {%- if lo[0] <= v and v < hi[0] -%}
              {%- set ns.soc = lo[1] + (v - lo[0]) / (hi[0] - lo[0]) * (hi[1] - lo[1]) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.soc | round(0) }}
        {%- endif -%}
      # A pack draining faster than the node should reserves by the faster figure.
      draw_ma: "{{ [quiet_ma, implied_ma] | max if implied_ma is number else quiet_ma }}"
      reserve_days: >-
        {{ (capacity_mah * soc_pct / 100 / (draw_ma * 24)) | round(0)
           if soc_pct is number and draw_ma > 0 else none }}
      flat: "{{ predawn_v is number and predawn_v < 3.5 }}"
      overcharged: "{{ predawn_v is number and predawn_v > 4.25 }}"
      draining: "{{ slope_ok and implied_ma > 3 * quiet_ma }}"
      not_refilling: "{{ charged and predawn_v is number and predawn_v < 3.9 }}"
      reserve_low: "{{ not charged and reserve_days is number and reserve_days < 14 }}"
      status: >-
        {%- if predawn_v is not number -%} unknown
        {%- elif flat or overcharged -%} replace now
        {%- elif draining or not_refilling or reserve_low -%} unhealthy
        {%- else -%} healthy
        {%- endif -%}
      # Text at the tags' own indentation, so YAML folds each reason onto one line.
      reason: >-
        {%- if predawn_v is not number -%}
        No overnight battery reading to judge (node offline, or HA restarted in the night).
        {%- elif overcharged -%}
        The pack sat at {{ predawn_v }} V overnight, above a full charge: the charger is
        overcharging it. Replace the pack and check the charger.
        {%- elif flat -%}
        The pack is down to {{ predawn_v }} V (~{{ soc_pct | int }} %). Swap in a charged pack.
        {%- elif draining -%}
        Draining at ~{{ implied_ma }} mA overnight against ~{{ quiet_ma }} mA expected:
        a weak pack, or a load that is not switching off (check the radar's SHDN wire).
        {%- elif not_refilling -%}
        Only {{ predawn_v }} V at dawn although the charger had input: the pack is not
        refilling (a weak pack, or the charger).
        {%- elif reserve_low -%}
        No charge input in 24 h (cold cutoff below 5 °C, or no sun) and
        ~{{ reserve_days | int }} days left: plan a swap.
        {%- elif not charged -%}
        OK. No charge input in 24 h (cold cutoff below 5 °C, or no sun);
        ~{{ reserve_days | int }} days in reserve.
        {%- else -%}
        OK. ~{{ reserve_days | int }} days in reserve.
        {%- endif -%}
    sensor:
      - name: "Creek Node Pack Health"
        unique_id: creek_node_pack_health
        icon: mdi:battery-heart-variant
        state: "{{ status }}"
        attributes:
          reason: "{{ reason }}"
          predawn_v: "{{ predawn_v }}"
          drain_mv_h: "{{ drain_mv_h }}"
          implied_ma: "{{ implied_ma }}"
          slope_skipped: "{{ not slope_ok }}"
          charge_input_24h: "{{ charged }}"
          soc_pct: "{{ soc_pct }}"
          reserve_days: "{{ reserve_days }}"
          capacity_mah: "{{ capacity_mah }}"

# Inputs to the 04:30 pack verdict above.
sensor:
  # Mean of the last hour, so a single 6.45 mV ADC step does not decide anything.
  - platform: statistics
    name: "Creek Node Battery Predawn"
    unique_id: creek_node_battery_predawn
    entity_id: sensor.creek_gateway_creek_node_battery
    state_characteristic: mean
    max_age:
      hours: 1
    sampling_size: 500
    precision: 3
  # Above 4.25 V can only be the charger's OUT rail, so this says whether the panel fed
  # the charger at all in the last day.
  - platform: statistics
    name: "Creek Node Battery Max 24h"
    unique_id: creek_node_battery_max_24h
    entity_id: sensor.creek_gateway_creek_node_battery
    state_characteristic: value_max
    max_age:
      hours: 24
    sampling_size: 20000
    precision: 3
  - platform: history_stats
    name: "Creek Node Fast Sampling Tonight"
    unique_id: creek_node_fast_sampling_tonight
    entity_id: binary_sensor.outside_creek_gateway_creek_node_fast_sampling
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

binary_sensor:
  # Only its `gradient` and `sample_count` attributes are used. The on/off state (rising or
  # not) means nothing here. 4.5 h = midnight to 04:30, which is dark all year.
  - platform: trend
    sensors:
      creek_node_pack_trend:
        friendly_name: "Creek Node Pack Trend"
        unique_id: creek_node_pack_trend
        entity_id: sensor.creek_gateway_creek_node_battery
        sample_duration: 16200
        max_samples: 2000
        min_samples: 30

automation:
  # Every one of these used to end in a dashboard row or a persistent notification — which
  # at 2 a.m. is the same as nothing. A gauge that goes blind during a storm is exactly when
  # the tiers stop meaning anything, so it has to reach a phone.
  #
  # Normal-priority push ("Creek Watch" channel) as a rule. CRITICAL (alarm stream) only
  # for a fault that blinds the gauge WHILE a storm is open: that is the one combination
  # where the missing number is a missing alarm. Respects the pause in creek_warning.yaml,
  # so work on the node does not page anyone.
  - id: creek_data_watchdog_push
    alias: "Creek: data problem"
    initial_state: true
    mode: queued
    max: 20
    triggers:
      # Gauge-blinding faults. The short `for:` rides out a single slow packet or an HA
      # restart; the sensors themselves already wait (telemetry 5 min, service 15 min).
      - trigger: state
        entity_id:
          - binary_sensor.creek_telemetry_stale
          - binary_sensor.outside_creek_gateway_creek_node_radar_fault
          - binary_sensor.creek_modeling_service_stale
          - binary_sensor.rate_of_rise_creek_stage_stale
          - binary_sensor.outside_rate_of_rise_creek_stage_frozen
        to: "on"
        for: "00:02:00"
        id: gauge
      # Withheld reading: say so at once, with the number, because the tiers are ignoring it.
      - trigger: state
        entity_id: binary_sensor.outside_rate_of_rise_creek_stage_implausible
        to: "on"
        id: gauge
      # Rain inputs: not blinding on their own (the other gauge still reports), but a
      # storm recorded with one dark is a storm half-recorded.
      - trigger: state
        entity_id:
          - binary_sensor.rate_of_rise_creek_rain_rate_stale
          - binary_sensor.rate_of_rise_creek_upstream_data_missing
        to: "on"
        for: "00:10:00"
        id: rain
      # The battery pack: a once-a-day verdict (04:30), so there is nothing to ride out.
      # Never critical: a pack running down is a trip to plan, not an alarm to wake for.
      - trigger: state
        entity_id: binary_sensor.creek_node_pack_replace_now
        to: "on"
        id: pack
    conditions:
      - condition: template
        value_template: "{{ not is_state('timer.creek_alerts_paused', 'active') }}"
    variables:
      entity: "{{ trigger.entity_id }}"
      what: "{{ state_attr(trigger.entity_id, 'friendly_name') or trigger.entity_id }}"
      storm: "{{ is_state('binary_sensor.rate_of_rise_creek_storm_in_progress', 'on') }}"
      is_critical: "{{ storm and trigger.id == 'gauge' }}"
      push_tag: "creek_watchdog_{{ trigger.entity_id.split('.')[1] }}"
      advice:
        binary_sensor.creek_telemetry_stale: >-
          No packets from the creek node. The node, the radio link or the gateway has
          stopped. If the gateway pings but publishes nothing, use its Restart switch.
        binary_sensor.outside_creek_gateway_creek_node_radar_fault: >-
          Packets are arriving but carry no distance reading. The radio link is fine; the
          radar or its 5 V rail is not.
        binary_sensor.creek_modeling_service_stale: >-
          The Rate of Rise add-on has not run inference in 15 minutes. Alert tiers are not
          being evaluated. Restart the add-on.
        binary_sensor.rate_of_rise_creek_stage_stale: >-
          No usable creek stage for 30 minutes. Stage-based Warning and Emergency cannot
          fire until it returns.
        binary_sensor.outside_rate_of_rise_creek_stage_frozen: >-
          The creek reading has not changed in 30 minutes although the node is reporting.
          The radar is probably returning a stale value. Rate of rise reads 0 regardless of
          the creek.
        binary_sensor.outside_rate_of_rise_creek_stage_implausible: >-
          The gauge reads a rise the creek could not have made, so the alert tiers are
          ignoring it as a sensor fault. Go and look — if it holds for 30 minutes the add-on
          will believe it.
        binary_sensor.rate_of_rise_creek_rain_rate_stale: >-
          The on-site rain gauge has not reported for an hour. On-site rain totals and the
          rain-driven tiers are blind.
        binary_sensor.rate_of_rise_creek_upstream_data_missing: >-
          No upstream weather station has answered for 40 minutes. Upstream rain totals
          and the Watch rules built on them are blind.
        binary_sensor.creek_node_pack_replace_now: >-
          The creek node's battery pack needs a visit.
      detail: >-
        {{ advice.get(entity, 'Check the Operator tab.') }}
        {% if entity == 'binary_sensor.outside_rate_of_rise_creek_stage_implausible' %}
        Reading: {{ states('sensor.creek_gateway_creek_depth') }} in.
        {% endif %}
        {% if entity == 'binary_sensor.creek_node_pack_replace_now' %}
        {{ state_attr('sensor.creek_node_pack_health', 'reason') }}
        {% endif %}
      # A plain YAML anchor, not an action: living here under `variables:` rather than
      # as its own actions[] entry keeps it from being schema-validated (and rejected)
      # as an action in its own right — it has no `device_id`/`action` key of its own,
      # only the two merged entries below do.
      _watch_push_template: &watch_push
        domain: mobile_app
        type: notify
        continue_on_error: true
        title: "{{ ('STORM — ' if storm else '') ~ 'Creek data problem: ' ~ what }}"
        message: "{{ detail }}"
        data:
          tag: "{{ push_tag }}"
          notification_icon: mdi:database-alert-outline
          ttl: 0
          priority: high
          # Same two channels as Creek Alert, never a new one: Android fixes a channel's
          # importance the first time it is used, and alarm_stream is the one already
          # granted Do Not Disturb override.
          channel: "{{ 'alarm_stream' if is_critical else 'Creek Watch' }}"
          importance: "{{ 'high' if is_critical else 'default' }}"
    actions:
      - action: persistent_notification.create
        data:
          notification_id: "{{ push_tag }}"
          title: "Creek data problem: {{ what }}"
          message: "{{ detail }}"
      - <<: *watch_push
        device_id: efa8fde8c961dd7d5c23feda71661457   # primary phone
      - <<: *watch_push
        device_id: add926d1f120f4aaba2565bf982c61b1   # second phone

  # Recovery clears what the problem push left behind, on the dashboard and on the phones,
  # so a fixed fault does not keep reading as a live one.
  - id: creek_data_watchdog_clear
    alias: "Creek: data problem cleared"
    initial_state: true
    mode: queued
    max: 20
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.creek_telemetry_stale
          - binary_sensor.outside_creek_gateway_creek_node_radar_fault
          - binary_sensor.creek_modeling_service_stale
          - binary_sensor.rate_of_rise_creek_stage_stale
          - binary_sensor.outside_rate_of_rise_creek_stage_frozen
          - binary_sensor.outside_rate_of_rise_creek_stage_implausible
          - binary_sensor.rate_of_rise_creek_rain_rate_stale
          - binary_sensor.rate_of_rise_creek_upstream_data_missing
          - binary_sensor.creek_node_pack_replace_now
        from: "on"
        to: "off"
    variables:
      push_tag: "creek_watchdog_{{ trigger.entity_id.split('.')[1] }}"
      # A plain YAML anchor, not an action: living here under `variables:` rather than
      # as its own actions[] entry keeps it from being schema-validated (and rejected)
      # as an action in its own right — it has no `device_id`/`action` key of its own,
      # only the two merged entries below do.
      _watch_clear_template: &watch_clear
        domain: mobile_app
        type: notify
        continue_on_error: true
        message: clear_notification
        data:
          tag: "{{ push_tag }}"
    actions:
      - action: persistent_notification.dismiss
        data:
          notification_id: "{{ push_tag }}"
      - <<: *watch_clear
        device_id: efa8fde8c961dd7d5c23feda71661457   # primary phone
      - <<: *watch_clear
        device_id: add926d1f120f4aaba2565bf982c61b1   # second phone
