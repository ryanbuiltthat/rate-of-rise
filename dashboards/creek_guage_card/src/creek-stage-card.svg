<svg xmlns="http://www.w3.org/2000/svg" id="creek-stage-card" viewBox="0 0 400 266" width="400" height="266" role="img" aria-label="Creek stage 1.4 feet, normal" font-family="var(--prism-font,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
