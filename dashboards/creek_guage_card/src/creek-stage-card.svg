<text id="bank-crest-label" x="22" y="118" font-size="9.5" font-weight="700" letter-spacing=".38" fill="var(--prism-text-secondary,#6b7280)">BANK 3.2 ft</text><path d="M10 124 H90 M316 118 H390" fill="none" stroke="var(--prism-good,#3aa76d)" stroke-width="3" stroke-linecap="round"></path>
