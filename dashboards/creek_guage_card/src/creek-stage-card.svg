<g class="th th-major" style="display:none" transform="translate(0 103.2)"><line x1="16" x2="384" y1="0" y2="0" stroke="var(--prism-purple,#8a6fd6)" stroke-width="1.5" stroke-dasharray="4 4"></line><rect x="314" y="-15" width="64" height="13" rx="6.5" fill="var(--prism-surface,#fff)"></rect><text id="th-major-label" x="374" y="-5.5" text-anchor="end" font-size="9.5" font-weight="700" letter-spacing=".38" fill="var(--prism-purple,#8a6fd6)">MAJOR 4.0 ft</text></g>
