<title>Creek Stage Card — Prism</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--prism-font);background:var(--prism-bg);color:var(--prism-text-primary)}
a{color:var(--prism-accent)}a:hover{opacity:.8}
.wrap{max-width:900px;margin:0 auto;padding:28px 20px;display:flex;flex-direction:column;gap:20px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;background:var(--prism-surface);border:1px solid var(--prism-border);border-radius:14px}
.bar label,.bar button{white-space:nowrap}.bar label{font-size:12px;font-weight:600;color:var(--prism-text-secondary);display:flex;align-items:center;gap:8px}
.bar input[type=range]{width:160px;accent-color:var(--prism-accent)}
.bar output{font-size:13px;font-weight:700;color:var(--prism-text-primary);min-width:44px}
.bar button{font:500 13px/1 var(--prism-font);cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid var(--prism-border);background:var(--prism-surface);color:var(--prism-text-primary)}
.bar button:hover{border-color:var(--prism-accent);color:var(--prism-accent)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:20px}
.theme{color:var(--prism-text-primary);display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:18px;background:var(--prism-bg)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--prism-text-secondary)}
.card-slot svg{display:block;width:100%;max-width:400px;height:auto}
.tile{max-width:400px;box-sizing:border-box;background:var(--prism-surface);border:1px solid var(--prism-border);border-radius:var(--prism-radius);padding:10px 10px 12px;display:flex;flex-direction:column;gap:12px}
.tile-row{display:flex;align-items:center;gap:10px;padding:2px}
.tile-ic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--prism-accent) 18%,transparent);color:var(--prism-accent);font-size:20px}
.tile-nm{font-size:14px;font-weight:600}
.tile-st{font-size:12px;font-weight:500;color:var(--prism-text-secondary)}
.feature-slot svg{display:block;width:100%;height:42px}
.creek-water{transition:transform .8s ease-out}.creek-wave{animation:creek-wave 3.2s linear infinite}.creek-wave-sm{animation:creek-wave-sm 3.2s linear infinite}
@keyframes creek-wave{to{transform:translateX(-24px)}}@keyframes creek-wave-sm{to{transform:translateX(-12px)}}
@media (prefers-reduced-motion:reduce){.creek-wave,.creek-wave-sm{animation:none}.creek-water{transition:none}}
</style>
</head>

<script>
const BASE = { unit: 'ft', bed: 0, flowUnit: 'cfs', updated: 'Updated 5m ago' };
const $s = document.getElementById('stage'), $t = document.getElementById('trend');
const $b = document.getElementById('bank'), $a = document.getElementById('action');
function flowFor(s) { return 14 * Math.pow(s + 0.4, 1.7); }
function render() {
  const bank = Math.max(0.5, +$b.value || 3.2), action = +$a.value;
  const max = +(bank * 1.4).toFixed(1);
  $s.max = max; document.querySelectorAll('[data-s]').forEach((b, i) => { b.dataset.s = [bank * 0.38, (action + bank) / 2, bank, bank * 1.22][i].toFixed(2); });
  const stage = Math.min(+$s.value, max), trend = +$t.value;
  document.getElementById('stage-o').textContent = stage.toFixed(1) + ' ft';
  document.getElementById('trend-o').textContent = (trend > 0 ? '+' : '') + trend.toFixed(1);
  const cfg = Object.assign({}, BASE, { bank, flood: bank, action: action > 0 ? action : null, major: null, max, stage, trend, flow: flowFor(stage), peak: Math.max(stage, stage + 0.7 - trend) });
  document.querySelectorAll('.card-slot svg').forEach((svg) => updateCreekCard(svg, cfg));
  document.querySelectorAll('.feature-slot svg').forEach((svg) => updateCreekFeature(svg, cfg));
  document.querySelectorAll('[data-tile-state]').forEach((el) => { el.textContent = stage.toFixed(1) + ' ft'; });
}
render();
$s.addEventListener('input', render); $b.addEventListener('input', render); $a.addEventListener('input', render); $t.addEventListener('input', render);
document.querySelectorAll('[data-s]').forEach((b) => b.addEventListener('click', () => { $s.value = b.dataset.s; render(); }));
</script>
</body>
