# Lovelace dashboard — Creek Flood Watch (spec Addendum B, Layer 3).
#
# Register it in configuration.yaml:
#   lovelace:
#     mode: storage            # keep your other dashboards on the UI editor
#     dashboards:
#       creek-flood-watch:
#         mode: yaml
#         title: Creek Flood Watch
#         icon: mdi:water-alert
#         show_in_sidebar: true
#         filename: dashboards/creek_flood_watch.yaml
#
# Stock cards only (gauge / history-graph / entities / markdown / button), styled by the
# Prism theme. Nearly everything here is auto-created by the Rate of Rise add-on
# (rate_of_rise/) via MQTT discovery, so it appears as soon as the add-on runs — no
# package required. Only binary_sensor.rate_of_rise_service_stale comes from
# ha-packages/creek_warning.yaml, and sensor.creek_gateway_* from the RFM69 gateway;
# both degrade gracefully when absent.
#
# ENTITY IDs: add-on entities are MQTT-discovery entities on the "Rate of Rise"
# device, so HA prefixes them -> sensor.rate_of_rise_creek_*. The two exceptions
# above are unprefixed -> sensor.creek_*.
#
# NOTE: `theme: Prism` assumes that theme is installed under that exact name — adjust or
# remove the theme keys if yours differs.

title: Creek Flood Watch

views:
  # ============================ HOUSEHOLD ==============================
  - title: Flood Watch
    path: flood-watch
    icon: mdi:water-alert
    theme: Prism
    cards:
      - type: markdown
        content: >
          # {{ state_attr('sensor.rate_of_rise_creek_alert_tier', 'label') or 'Unknown' }}

          **Tier {{ states('sensor.rate_of_rise_creek_alert_tier') }}** · flood probability
          **{{ states('sensor.rate_of_rise_creek_flood_probability') }}%**
          ({{ states('sensor.rate_of_rise_creek_model_method') }} model)

          {% set tier = states('sensor.rate_of_rise_creek_alert_tier') %}
          {% if tier == '4' %}🚨 Flooding imminent or underway — act now.
          {% elif tier == '3' %}⚠️ Creek is responding to rain — monitor closely.
          {% elif tier == '2' %}👀 Rain is falling upstream — conditions are setting up.
          {% elif tier == '1' %}🌧️ Forecast risk — wet ground with rain coming.
          {% else %}✅ No elevated flood risk right now.
          {% endif %}

          {% set why = state_attr('sensor.rate_of_rise_creek_alert_tier', 'why') %}
          {% if tier not in ['0', 'unknown', 'unavailable'] and why %}**Why:** {{ why }}{% endif %}

          _Placeholder thresholds — not yet field-calibrated (open questions #5/#7)._

      - type: gauge
        entity: sensor.rate_of_rise_creek_flood_probability
        name: Flood Probability
        unit: '%'
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 20
          red: 50

      - type: history-graph
        title: Creek Level (24 h)
        hours_to_show: 24
        entities:
          - entity: sensor.creek_gateway_creek_depth
            name: Depth

      - type: entities
        title: Now
        show_header_toggle: false
        entities:
          - entity: sensor.rate_of_rise_creek_predicted_crest
            name: Predicted crest
          - entity: sensor.rate_of_rise_creek_lag_estimate
            name: Lag estimate
          - entity: sensor.rate_of_rise_creek_soil_moisture_mean
            name: Soil moisture (mean)
          - entity: binary_sensor.rate_of_rise_creek_soil_ponding
            name: Low-lying ponding

      - type: entities
        title: Rainfall & forecast
        show_header_toggle: false
        entities:
          - entity: sensor.rate_of_rise_creek_rain_1h
            name: Rain (1 h)
          - entity: sensor.rate_of_rise_creek_rain_6h
            name: Rain (6 h)
          - entity: sensor.rate_of_rise_creek_rain_24h
            name: Rain (24 h)
          - entity: sensor.rate_of_rise_creek_rain_72h
            name: Rain (72 h)
          - type: divider
          - entity: sensor.rate_of_rise_creek_qpf_6h
            name: Forecast rain (next 6 h)
          - entity: sensor.rate_of_rise_creek_qpf_24h
            name: Forecast rain (next 24 h)
          - type: divider
          # Basin-wide antecedent wetness — weeks of rainfall history in one number.
          # High API means the next storm runs off instead of soaking in.
          - entity: sensor.rate_of_rise_creek_antecedent_precipitation_index
            name: Antecedent precipitation index

      # WPC's Excessive Rainfall Outlook: the only input that grades forecast rain
      # against what the ground can actually absorb, and the earliest one — it exists
      # before anything is on radar. Day 1 also floors the alert tier (§6).
      - type: entities
        title: Excessive rainfall outlook (WPC)
        show_header_toggle: false
        entities:
          - entity: sensor.rate_of_rise_creek_wpc_excessive_rain_risk_day_1
            name: Today
          - entity: sensor.rate_of_rise_creek_wpc_excessive_rain_risk_day_2
            name: Tomorrow
          - entity: sensor.rate_of_rise_creek_wpc_excessive_rain_risk_day_3
            name: Day 3

      # Inbound convective cells from <nexrad site>'s storm-attribute table. The one leading
      # indicator that works for the dominant W/NW approach, where a cell reaches the
      # house before the SE upstream gauges see any rain. ETA empty = nothing inbound.
      - type: entities
        title: Inbound cells (radar)
        show_header_toggle: false
        entities:
          - entity: sensor.rate_of_rise_creek_radar_threat_eta
            name: Inbound cell ETA
          - entity: sensor.rate_of_rise_creek_radar_threat_cells
            name: Cells on intercept
          - entity: sensor.rate_of_rise_creek_radar_threat_max_dbz
            name: ↳ strongest (dBZ)
          - entity: sensor.rate_of_rise_creek_radar_cells_tracked
            name: Cells tracked (<nexrad site>)

      # Snowpack. Rain-on-snow is a major regional flood driver (spec §1) — the pack melts
      # into the same storm, so runoff exceeds what the rainfall alone suggests.
      - type: entities
        title: Snowpack
        show_header_toggle: false
        entities:
          - entity: binary_sensor.rate_of_rise_creek_rain_on_snow
            name: Rain on snow
          - entity: sensor.rate_of_rise_creek_snow_water_equivalent
            name: Snow water equivalent
          - entity: sensor.rate_of_rise_creek_temperature
            name: Temperature

      # Active NWS products covering the site. Any of these floors the alert tier (§6).
      - type: entities
        title: NWS alerts
        show_header_toggle: false
        entities:
          - entity: binary_sensor.rate_of_rise_creek_nws_flash_flood_warning
            name: Flash Flood Warning
          - entity: binary_sensor.rate_of_rise_creek_nws_flood_warning
            name: Flood Warning
          - entity: binary_sensor.rate_of_rise_creek_nws_flood_watch
            name: Flood Watch
          - entity: sensor.rate_of_rise_creek_nws_alert_count
            name: Active alerts (all types)

      - type: entities
        title: Upstream & model
        show_header_toggle: false
        entities:
          - entity: sensor.rate_of_rise_creek_upstream_rain_1h
            name: Upstream rain (1 h)
          - entity: sensor.rate_of_rise_creek_upstream_rain_6h
            name: Upstream rain (6 h)
          - entity: sensor.rate_of_rise_creek_upstream_rain_24h
            name: Upstream rain (24 h)
          - entity: sensor.rate_of_rise_creek_upstream_precip_today
            name: Upstream rain (today)
          - type: divider
          - entity: sensor.rate_of_rise_creek_nwm_flow
            name: NWM forecast flow
          - entity: sensor.rate_of_rise_creek_nwm_flow_peak
            name: NWM forecast peak

      # Downstream USGS gauges. Different basin and a longer lag than ours, so these are
      # NOT a proxy for creek level — they are the observed response signal used to
      # estimate the rainfall->crest lag until the creek node is mounted (spec §1/§7).
      - type: entities
        title: Downstream gauges (validation)
        show_header_toggle: false
        entities:
          - entity: sensor.rate_of_rise_creek_usgs_adjacent_gage_height
            name: Adjacent-basin gauge
          - entity: sensor.rate_of_rise_creek_usgs_adjacent_rise_3h
            name: ↳ rise (3 h)
          - type: divider
          - entity: sensor.rate_of_rise_creek_usgs_downstream_gage_height
            name: Downstream gauge
          - entity: sensor.rate_of_rise_creek_usgs_downstream_rise_3h
            name: ↳ rise (3 h)

      - type: history-graph
        title: Upstream rain vs downstream response (24 h)
        hours_to_show: 24
        entities:
          - entity: sensor.rate_of_rise_creek_upstream_rain_3h
            name: Upstream rain (3 h)
          - entity: sensor.rate_of_rise_creek_usgs_adjacent_gage_height
            name: the adjacent creek gage

  # ============================ OPERATOR ==============================
  - title: Operator
    path: operator
    icon: mdi:cog
    theme: Prism
    cards:
      # Banner only while the service is mid-task.
      - type: conditional
        conditions:
          - entity: sensor.rate_of_rise_creek_pipeline_state
            state: running
        card:
          type: markdown
          content: >
            ⏳ **Pipeline running** — task:
            {{ state_attr('sensor.rate_of_rise_creek_pipeline_state', 'task') }}. Buttons are queued
            single-threaded, so a press now runs after the current task.

      - type: entities
        title: Controls
        show_header_toggle: false
        entities:
          - entity: button.rate_of_rise_creek_run_inference_now
            name: Run inference now
          - entity: button.rate_of_rise_creek_retrain_now
            name: Retrain now
          - type: divider
          - entity: button.rate_of_rise_creek_promote_model
            name: Promote candidate → active
          - entity: button.rate_of_rise_creek_rollback_model
            name: Rollback to previous
          - type: divider
          - entity: sensor.rate_of_rise_creek_last_command
            name: Last command
            secondary_info: last-changed

      # Phase 3: the storm record and the lag it is being used to measure.
      - type: entities
        title: Storms & lag
        show_header_toggle: false
        entities:
          - entity: binary_sensor.rate_of_rise_creek_storm_in_progress
            name: Storm in progress
          - entity: sensor.rate_of_rise_creek_event_count
            name: Storms recorded
          - type: divider
          - entity: sensor.rate_of_rise_creek_lag_estimate
            name: Rainfall → response lag
          # Which series the lag was fitted against. Until the creek node exists this
          # reads as a USGS proxy — a different, larger basin, so that number is a sanity
          # check on the method, NOT the creek's warning window.
          - entity: sensor.rate_of_rise_creek_lag_response_series
            name: ↳ fitted against
          - type: divider
          # Annotation from here, no SSH/Samba needed for the normal case. Shows *which*
          # storm the text box targets — the most recent *closed* one, which may not be
          # the newest row if a second storm has already opened — before you type
          # anything, so you are never annotating blind. Anything more specific (an older
          # un-annotated storm, correcting one already noted) still needs the sqlite3/
          # Samba path in docs/storm-runbook.md.
          - entity: sensor.rate_of_rise_creek_storm_to_annotate
            name: Ready to annotate
          - entity: text.rate_of_rise_creek_annotate_latest_storm
            name: ↳ notes

      - type: entities
        title: Pipeline & model status
        show_header_toggle: false
        entities:
          - entity: sensor.rate_of_rise_creek_pipeline_state
            name: Pipeline state
          - entity: sensor.rate_of_rise_creek_last_inference
            name: Last inference
          - entity: sensor.rate_of_rise_creek_last_nightly_run
            name: Last nightly run
          - type: divider
          - entity: sensor.rate_of_rise_creek_model_health
            name: Model health
          - entity: sensor.rate_of_rise_creek_model_method
            name: Active method
          - entity: sensor.rate_of_rise_creek_dataset_rows
            name: Dataset rows
          - entity: sensor.rate_of_rise_creek_event_count
            name: Storm events captured
          - entity: sensor.rate_of_rise_creek_active_model
            name: Active model
          - entity: sensor.rate_of_rise_creek_candidate_model
            name: Candidate model

      - type: markdown
        title: Model review
        content: >
          ### Active vs candidate

          | Metric | Active | Candidate |
          |---|---|---|
          | Version | {{ states('sensor.rate_of_rise_creek_active_model') }} | {{ states('sensor.rate_of_rise_creek_candidate_model') }} |
          {% set a = state_attr('sensor.rate_of_rise_creek_active_model', 'active_metrics') or {} %}
          {% set c = state_attr('sensor.rate_of_rise_creek_active_model', 'candidate_metrics') or {} %}
          {% set keys = (a.keys() | list + c.keys() | list) | unique | list %}
          {% for k in keys %}| {{ k }} | {{ a.get(k, '—') }} | {{ c.get(k, '—') }} |
          {% endfor %}

          **Promote** activates the candidate — but only one that a held-out split
          could actually score (it has a `roc_auc`). A candidate whose test split
          came back empty or single-class is refused, because a promoted model's
          probability alone raises Tier 3 at 50% and Tier 4 at 80%. To override
          deliberately, publish `force` to `creek/cmd/promote`.

          **Rollback** undoes the last promote. With no earlier model to return to
          it restores the threshold estimate, so backing out a bad promotion never
          requires editing `registry.json` by hand.

      - type: entities
        title: Ingestion health
        show_header_toggle: false
        entities:
          - entity: sensor.creek_gateway_stage
            name: Creek stage
            secondary_info: last-changed
          - entity: sensor.rate_of_rise_creek_rate_of_rise
            name: Creek rate of rise
            secondary_info: last-changed
          # A blank rate of rise is normal right after the radio link returns — the add-on
          # will not difference a reading against one from before a dropout. These two say
          # whether that is what is happening: the link itself, and how old the stage
          # reading behind the rate is.
          - entity: binary_sensor.creek_gateway_creek_node_status
            name: Creek node link
            secondary_info: last-changed
          - entity: sensor.rate_of_rise_creek_stage_age
            name: Stage reading age
          - entity: sensor.outside_weather_station_soil_moisture_willow
            name: Soil — near house
            secondary_info: last-changed
          - entity: sensor.outside_weather_station_soil_moisture_field
            name: Soil — near creek
            secondary_info: last-changed
          - entity: sensor.outside_weather_station_rain_intensity
            name: Rain rate
            secondary_info: last-changed
          - entity: sensor.outside_weather_station_rain_daily
            name: Rain today
            secondary_info: last-changed

      - type: entities
        title: Watchdogs
        show_header_toggle: false
        entities:
          - entity: binary_sensor.rate_of_rise_creek_stage_stale
            name: Creek stage stale
          - entity: binary_sensor.rate_of_rise_creek_soil_moisture_stale
            name: Soil moisture stale
          - entity: binary_sensor.rate_of_rise_creek_rain_rate_stale
            name: Rain rate stale
          # Stays HA-side: the add-on cannot report its own death.
          - entity: binary_sensor.rate_of_rise_service_stale
            name: Modeling service stale
          - type: divider
          # Ingest sources — ON means the source published no value, not that the value
          # is old (a legitimate 0.00 in never changes state).
          - entity: binary_sensor.rate_of_rise_creek_forecast_data_missing
            name: NWS QPF missing
          - entity: binary_sensor.rate_of_rise_creek_upstream_data_missing
            name: Upstream PWS missing
          - entity: binary_sensor.rate_of_rise_creek_nwm_data_missing
            name: NWM reach missing
          - entity: binary_sensor.rate_of_rise_creek_downstream_gauge_missing
            name: USGS gauges missing
          - entity: binary_sensor.rate_of_rise_creek_snowpack_data_missing
            name: SNODAS snowpack missing
          - entity: binary_sensor.rate_of_rise_creek_nws_alert_feed_missing
            name: NWS alert feed missing
          - entity: binary_sensor.rate_of_rise_creek_radar_cells_missing
            name: Radar cell feed missing
          - entity: binary_sensor.rate_of_rise_creek_wpc_outlook_missing
            name: WPC outlook missing
